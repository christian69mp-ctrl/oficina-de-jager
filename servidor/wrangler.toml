name = "oficina-jager"
main = "worker.js"
compatibility_date = "2025-06-01"

# Modelos (cámbialos si salen versiones nuevas)
[vars]
CLAUDE_MODEL = "claude-opus-5-5"          # solo para el guion de Nora
CLAUDE_MODEL_LIGERO = "claude-sonnet-5-5"  # la mesa, Paco y Nyx
CLAUDE_MODEL_RAPIDO = "claude-haiku-5-5"   # tareas mecánicas: aplicar correcciones
GEMINI_MODEL = "gemini-2.5-flash"
GEMINI_IMAGE_MODEL = "gemini-2.5-flash-image"
OPENAI_MODEL = "gpt-4.1-mini"

# Almacén para compartir datos entre el móvil y el ordenador.
# Lo crea `npx wrangler kv namespace create DATOS` (ver README).

# Motor de pedidos: cada vídeo avanza en el servidor aunque la oficina esté cerrada
[[workflows]]
name = "oficina-pedido"
binding = "PEDIDO"
class_name = "Pedido"
